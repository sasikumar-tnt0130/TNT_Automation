[application]
default_environment = uat_storoutlet
environments = dev, uat, uat_storoutlet, stage

# Runtime / suite tuning. Sandbox URLs + property catalog: config/properties/<env>.ini.
# Credentials: secrets.ini.

[browser]
name = chromium
# true = headless, false = headed. Headed maximizes the real Chrome
# window (no_viewport + --start-maximized + CDP). Headless uses the
# largest connected display as the viewport. Set both numbers below to
# pin a size in either mode (0 / omit = auto).
headless = false
slow_mo = 0
# Milliseconds (same unit as [waits] and [email]).
timeout = 60000
# viewport_width = 0
# viewport_height = 0
# Playwright / Allure artifacts. Prefer on_failure to keep reports small.
# attach_*: always | on_failure | never
# allure_single_file=true embeds every attachment into one huge index.html
record_video = true
attach_video = on_failure
attach_log = never
record_setup_video = false
record_trace = true
attach_trace = on_failure
# Failure shots: viewport is enough; full page HTML/PNG are large.
attach_full_page_screenshot = false
attach_page_source = false
# Multi-file report + allure open (do not open index.html in File Explorer).
allure_single_file = true
allure_open = false
reruns = 0
reruns_delay = 3
permissions = microphone

# Structure only; merchant/keys live in secrets.ini.
# profile = tenant_payments | non_tenant_payments
[gateway.tenant_payments_card]
method = Credit Cards
profile = tenant_payments

[gateway.tenant_payments_ach]
method = ACH
profile = tenant_payments

[gateway.authorize_net_card]
method = Credit Cards
profile = non_tenant_payments
# Storefront card payment must collect a billing address.
billing_address = required

[cleanup]
# true: wipe reports/ and __pycache__/ at session start (skipped for --collect-only).
clean_before_session = true
# true: rental smoke/cases move the space out after the test (default).
# Override for one run with: pytest --no-move-out
move_out_after_rental = false
# true: cancel unfinished reservations after the test (default).
# Override for one run with: pytest --no-cancel-reservation
cancel_reservation_after = false

[testrail]
# URL only; email and api_key are in secrets.ini.
url = https://storagefront.testrail.net

[email]
# Wait for the second Two-Step rental confirmation (updated super lease).
second_rental_email_wait_ms = 120000
# Mailinator free API is flaky; retry until these budgets are spent.
http_retries = 120
http_retry_delay_ms = 4000

[waits]
# Named page-object waits (ms). [browser] timeout stays the overall default.
tiny_ms = 4000
short_ms = 5000
medium_ms = 10000
long_ms = 15000
extra_long_ms = 30000
poll_interval_ms = 500
