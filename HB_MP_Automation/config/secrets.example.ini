authnetKey =

# TestRail credentials. URL stays in environments.ini.
[testrail]
email =
api_key =

# One Gmail inbox for confirmation-email checks. Guests use this address as written.
# Create the account in a browser, turn on 2-Step Verification, then
# create an App Password (Google Account → Security → App passwords).
# Store that 16-character app password here, not the normal Gmail password.
[gmail]
email =
app_password =
