# Property catalog for uat_storoutlet.
# Loaded by load_config from config/properties/*.ini (before secrets.ini).
#
# legacy_property / two_step_property may point at the same key (toggle
# Two-Step on/off per suite) or at different keys (e.g. Bellflower +
# chula_vista). List each distinct key once under `properties`.

[uat_storoutlet]
hb_base_url = https://sandbox-storoutlet.tenant-platform.com
mp_base_url = https://tenantv2-strat.storagefront.com/
properties = Bellflower
legacy_property = Bellflower
two_step_property = Bellflower

[uat_storoutlet.Bellflower]
lease_configuration_property_name = Bellflower
fms_property_name = Bellflower
hb_property_name = Bellflower
apw_advance_reservation_enable = false
mp_state = California
mp_city = Bellflower
landing_page_layout = Default
value_tier_layout = Grid View
advance_reservation_days = 4
notes = Shared Legacy/Two-Step property when both roles point here; suites toggle Two-Step.

[uat_storoutlet.chula_vista]
lease_configuration_property_name = Chula Vista
fms_property_name = Chula Vista
hb_property_name = Chula Vista
apw_advance_reservation_enable = false
mp_state = California
mp_city = Chula Vista
landing_page_layout = List View
value_tier_layout = Grid View
advance_reservation_days = 4
notes = Optional dedicated Two-Step property (set two_step_property = chula_vista).
