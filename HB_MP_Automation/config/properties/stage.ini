# Property catalog for stage.
# Loaded by load_config from config/properties/*.ini (before secrets.ini).

[stage]
hb_base_url = https://sandbox.tenant-staging.com
mp_base_url = https://tenantv2-staging.storagefront.com/
properties = hamilton_garden_grove, lightning_rutland
legacy_property = hamilton_garden_grove
two_step_property = lightning_rutland

[stage.hamilton_garden_grove]
lease_configuration_property_name = Hamilton Self Storage
fms_property_name = GARDEN GROVE
hb_property_name = Hamilton County
apw_advance_reservation_enable = false
mp_state = California
mp_city = Garden Grove
landing_page_layout = List View
value_tier_layout = Grid View
advance_reservation_days = 4
notes = Legacy/Traditional Signing property - default for stage.

[stage.lightning_rutland]
lease_configuration_property_name = Lightning Storage
fms_property_name = Rutland
hb_property_name = Rutland
apw_advance_reservation_enable = false
mp_state = Massachusetts
mp_city = Rutland
landing_page_layout = List View
value_tier_layout = Grid View
advance_reservation_days = 4
notes = Two-Step signing property
