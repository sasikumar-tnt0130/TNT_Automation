[pytest]
testpaths = tests
# Each run starts with empty reports/allure-results (--clean-alluredir). After
# the run finishes, conftest.py writes one report to reports/allure-report
# (same path for a single test, a file, or -m …). Collect-only skips generate.
# -v: show PASSED/FAILED/SKIPPED in the terminal (not just green/red dots).
addopts = -v --clean-alluredir
markers =
    mp_rental: storefront rental scenarios - a real rental and a move-out per case
    tenant_payments_gateway: rentals on a property paid through the Tenant Payments gateway
    non_tenant_payments_gateway: rentals on a property paid through another gateway
    legacy_traditional: Legacy flow, Traditional signing (Clickwrap off, Super Lease off)
    legacy_clickwrap: Legacy flow, Clickwrap signing (Clickwrap on, Super Lease off)
    legacy_superlease: Legacy flow, Super Lease signing (Clickwrap on, Super Lease on)
    two_step_superlease: 2Step flow, Super Lease signing
    card: paid by credit card
    ach: paid by ACH / E-Check
    autopay: enrols in autopay
    no_autopay: no autopay
    desktop: storefront in the desktop view
    mobile: storefront in the mobile view (iPhone 13)
    individual: rented as an individual
    rab: rented as a business
    testrail: the TestRail case this test covers, e.g. @pytest.mark.testrail("C16921")
    smoke: part of the TestRail smoke suite (run 2967) - runs with -m smoke
