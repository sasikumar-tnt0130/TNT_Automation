[application]
default_environment = stage
environments = dev, uat, uat_storoutlet, stage

# Runtime / suite tuning. Sandbox URLs + property catalog: config/properties/<env>.ini.
# Credentials: secrets.ini.

[browser]
name = chromium
headless = false
slow_mo = 0
# Milliseconds (same unit as [waits] and [email]).
timeout = 60000
# viewport_width = 0
# viewport_height = 0
# Playwright / Allure artifacts. Prefer on_failure to keep reports small.
# attach_*: always | on_failure | never
# allure_single_file=true embeds every attachment into one huge index.html
record_video =true
attach_video = on_failure
attach_log = never
# Desktop rentals use one browser tab (HB ↔ storefront URL switch) so
# Playwright records a single execution-video — no ffmpeg merge.
# record_setup_video: still used by one-off hb_admin_context helpers.
record_setup_video = true
record_trace = true
attach_trace = on_failure
# Failure shots: viewport is enough; full page HTML/PNG are large/slow.
attach_full_page_screenshot = true
attach_page_source = false
# Multi-file report — open with `allure open` (not File Explorer).
# single_file=true embeds video/PDF/trace into one index.html (this suite
# hit ~1.5 GB — browsers refuse to open it; live 2026-09-22).
allure_single_file = false
allure_open = true
reruns = 0
reruns_delay = 3
permissions = microphone

# Structure only; merchant/keys live in secrets.ini.
# profile = tenant_payments | non_tenant_payments
[gateway.tenant_payments_card]
method = Credit Cards
profile = tenant_payments

[gateway.tenant_payments_ach]
method = ACH
profile = tenant_payments

[gateway.authorize_net_card]
method = Credit Cards
profile = non_tenant_payments
# Storefront card payment must collect a billing address.
billing_address = required

[cleanup]
# true: wipe reports/ and __pycache__/ at session start (skipped for --collect-only).
clean_before_session = true
# true: rental smoke/cases move the space out after the test (default).
# Override for one run with: pytest --no-move-out
move_out_after_rental = false
# true: cancel unfinished reservations after the test (default).
# Override for one run with: pytest --no-cancel-reservation
cancel_reservation_after = false

[validation]
# false (default): only assert Total Cost to Move-in (MP | email | lease).
# true: also assert every rent line item (Admin Fee, Coverage, …).
validate_cost_line_items = false

[testrail]
# URL only; email and api_key are in secrets.ini.
url = https://storagefront.testrail.net

[email]
# Every guest is the address in secrets.ini [gmail], unchanged.
# IMAP uses a Google App Password (personal Gmail has IMAP on).
# Second Two-Step rental confirmation (updated super lease). A missing
# one is only noted, so this stays short. Raise it when diagnosing delivery.
second_rental_email_wait_ms = 60000
inbox_poll_seconds = 4

[waits]
# settle_* = blind wait_for_timeout only (keep small).
# tiny/short/medium/long/extra_long = expect / click / goto ceilings.
settle_tiny_ms = 150
settle_short_ms = 400
settle_medium_ms = 1000
tiny_ms = 3000
short_ms = 10000
medium_ms = 20000
long_ms = 45000
extra_long_ms = 90000
poll_interval_ms = 250
