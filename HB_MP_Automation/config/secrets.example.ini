# Sandbox card/ACH values for storefront rental flows.
# Hosted card UI (MRECOM-323): PAN 13–19 digits; expiry MM/YY or MM/YYYY;
# CVV 3 digits (Visa/MC/…) or 4 (Amex). Hosted-format rental cases pay with
# these (or format-specific sandbox PANs) and assert rental confirmation.
[payment]
card_number =
card_expiry =
card_cvc =
card_zip_code =
ach_routing_number =
ach_account_number =
ach_account_type =

# Gateway credentials. method/profile stay in environments.ini.
[gateway.tenant_payments_card]
merchant =
api_key =
public_api_key =
account_number =
deviceId =

[gateway.tenant_payments_ach]
merchant =
account_number =

[gateway.authorize_net_card]
